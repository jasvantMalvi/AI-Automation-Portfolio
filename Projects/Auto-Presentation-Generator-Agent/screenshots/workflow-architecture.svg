<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.h{font:700 30px Arial;fill:#0f172a}.sub{font:16px Arial;fill:#475569}.box{rx:14;stroke-width:2}.t{font:700 17px Arial;fill:#0f172a;text-anchor:middle}.s{font:14px Arial;fill:#475569;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc"/><text x="65" y="65" class="h">Auto Presentation Generator Agent</text><text x="65" y="96" class="sub">n8n • GPT-5 Mini • Google Slides • Google Sheets • Gmail</text>
